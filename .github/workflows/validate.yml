name: vocab prüfen

on:
  push:
    paths: ["vocab.json", "vocab.sample.json", "validate_vocab.py", "index.html"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Beispieldaten prüfen
        run: python validate_vocab.py vocab.sample.json
      - name: vocab.json prüfen (falls vorhanden)
        run: |
          if [ -f vocab.json ]; then python validate_vocab.py vocab.json; else echo "vocab.json noch nicht im Repo"; fi
      - name: JavaScript-Syntax der App prüfen
        run: |
          node -e "
          const fs=require('fs');const h=fs.readFileSync('index.html','utf8');
          const m=h.match(/<script>([\s\S]*)<\/script>/);new Function(m[1]);console.log('JS OK');"
